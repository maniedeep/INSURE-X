        timestamp: { type: string, format: date-time }
        metadata: { type: string }
      required: [id, action, entityType, entityId, actingUser, timestamp, metadata]
    AuditLogPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AuditLog" }
        page: { type: number }
