        event:
          $ref: "#/components/schemas/ClaimEvent"
      required: [claim, payment, event]
    PaymentPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Payment" }
        page: { type: number }
        pageSize: { type: number }
        total: { type: number }
